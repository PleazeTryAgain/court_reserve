plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.courtreserve'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'io.karatelabs:karate-junit5:1.5.1'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Pruebas unitarias y de integración (excluye las de aceptación con Karate)
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'karate'
    }
}

// Pruebas de aceptación de la API REST con Karate
def karateTest = tasks.register('karateTest', Test) {
    description = 'Ejecuta las pruebas de aceptación de la API con Karate.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'karate'
    }
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn karateTest
}

// Umbrales alineados con el Quality Gate "Sonar way"
def coberturaMinima = 0.80
def exclusionesCobertura = ['com/courtreserve/CourtReserveApplication.class']

jacocoTestReport {
    dependsOn tasks.named('test'), karateTest
    executionData.setFrom(fileTree(layout.buildDirectory.dir('jacoco')).include('*.exec'))

    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: exclusionesCobertura)
    }))

    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    executionData.setFrom(jacocoTestReport.executionData)
    classDirectories.setFrom(jacocoTestReport.classDirectories)

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = coberturaMinima
            }
            limit {
                counter = 'BRANCH'
                minimum = coberturaMinima
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

sonar {
    properties {
        property 'sonar.projectKey', 'PleazeTryAgain_court_reserve'
        property 'sonar.organization', 'pleazetryagain'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.path
        property 'sonar.junit.reportPaths', [
                layout.buildDirectory.dir('test-results/test').get().asFile.path,
                layout.buildDirectory.dir('test-results/karateTest').get().asFile.path
        ].join(',')
        property 'sonar.coverage.exclusions', '**/CourtReserveApplication.java'

        // La tarea sonar falla si el Quality Gate no se cumple
        property 'sonar.qualitygate.wait', 'true'
        property 'sonar.qualitygate.timeout', '300'

        // Por defecto el plugin solo analiza src/main/java; se suman las plantillas Thymeleaf
        properties['sonar.sources'] += file('src/main/resources/templates')
    }
}
