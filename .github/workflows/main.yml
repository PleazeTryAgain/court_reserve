name: CI - Build, pruebas y SonarQube Cloud
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo para que Sonar calcule el código nuevo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Cache de paquetes de SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Dar permisos de ejecución al wrapper
        run: chmod +x gradlew
      - name: Build, pruebas unitarias, pruebas Karate y cobertura JaCoCo
        run: ./gradlew clean build jacocoTestReport
      - name: Análisis estático con SonarQube Cloud
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar
      - name: Publicar reportes de pruebas
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/karate-reports/
          if-no-files-found: ignore
      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: court-reserve
          path: build/libs/*.jar
