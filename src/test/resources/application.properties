# Configuracion de base de datos para pruebas: H2 en memoria.
# Evita depender de una instancia real de PostgreSQL al ejecutar ./gradlew test.
spring.datasource.url=jdbc:h2:mem:court_reserve_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
