<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Usuarios | CourtReserve</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"> CourtReserve </a>

        <div class="navbar-nav ms-auto">
          <a class="nav-link" th:href="@{/}"> Inicio </a>

          <a class="nav-link active" th:href="@{/usuarios}"> Usuarios </a>

          <a class="nav-link" th:href="@{/canchas}"> Canchas </a>

          <a class="nav-link" th:href="@{/reservas}"> Reservas </a>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <div class="mb-4">
        <h1 class="fw-bold">Gestión de usuarios</h1>

        <p class="text-muted">
          Registra y consulta los usuarios de CourtReserve.
        </p>
      </div>

      <div
        th:if="${mensajeExito}"
        class="alert alert-success alert-dismissible fade show"
        role="alert"
      >
        <strong>¡Éxito!</strong>
        <span th:text="${mensajeExito}"></span>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>

      <div
        th:if="${mensajeError}"
        class="alert alert-danger alert-dismissible fade show"
        role="alert"
      >
        <strong>Error:</strong>
        <span th:text="${mensajeError}"></span>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h4 class="mb-4">Nuevo usuario</h4>

              <form th:action="@{/usuarios}" method="post">
                <div class="mb-3">
                  <label class="form-label"> Nombre </label>

                  <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    maxlength="100"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label"> Correo </label>

                  <input
                    type="email"
                    name="correo"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label"> Teléfono </label>

                  <input
                    type="text"
                    name="telefono"
                    class="form-control"
                    maxlength="20"
                  />
                </div>

                <button type="submit" class="btn btn-dark w-100">
                  Registrar usuario
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <div
                class="d-flex justify-content-between align-items-center mb-4"
              >
                <h4 class="mb-0">Usuarios registrados</h4>

                <span class="badge text-bg-dark" th:text="${usuarios.size()}">
                  0
                </span>
              </div>

              <div class="table-responsive">
                <table class="table table-hover align-middle">
                  <thead class="table-light">
                    <tr>
                      <th>ID</th>
                      <th>Nombre</th>
                      <th>Correo</th>
                      <th>Teléfono</th>
                    </tr>
                  </thead>

                  <tbody>
                    <tr th:each="usuario : ${usuarios}">
                      <td th:text="${usuario.id}">1</td>

                      <td th:text="${usuario.nombre}">Usuario</td>

                      <td th:text="${usuario.correo}">correo@email.com</td>

                      <td th:text="${usuario.telefono}">3000000000</td>
                    </tr>

                    <tr th:if="${usuarios.isEmpty()}">
                      <td colspan="4" class="text-center text-muted py-4">
                        No hay usuarios registrados.
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
