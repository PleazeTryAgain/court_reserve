<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Canchas | CourtReserve</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            CourtReserve
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link"
               th:href="@{/}">
                Inicio
            </a>

            <a class="nav-link"
               th:href="@{/usuarios}">
                Usuarios
            </a>

            <a class="nav-link active"
               th:href="@{/canchas}">
                Canchas
            </a>

            <a class="nav-link"
               th:href="@{/reservas}">
                Reservas
            </a>

        </div>
    </div>
</nav>


<div class="container py-5">

    <div th:if="${mensajeExito}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <strong>¡Éxito!</strong>
        <span th:text="${mensajeExito}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>
    </div>

    <div th:if="${mensajeError}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">

        <strong>Error:</strong>
        <span th:text="${mensajeError}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>
    </div>


    <div class="mb-4">

        <h1 class="fw-bold">
            Gestión de canchas
        </h1>

        <p class="text-muted">
            Registra, consulta y administra el estado de las canchas.
        </p>

    </div>


    <div class="row g-4">

        <div class="col-lg-4">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h4 class="mb-4">
                        Nueva cancha
                    </h4>

                    <form th:action="@{/canchas}"
                          method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                Nombre
                            </label>

                            <input
                                type="text"
                                name="nombre"
                                class="form-control"
                                maxlength="100"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Tipo
                            </label>

                            <select
                                name="tipo"
                                class="form-select"
                                required>

                                <option value=""
                                        disabled
                                        selected>
                                    Seleccione un tipo
                                </option>

                                <option
                                    th:each="tipo : ${tiposCancha}"
                                    th:value="${tipo}"
                                    th:text="${tipo}">
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Precio por hora
                            </label>

                            <input
                                type="number"
                                name="precioHora"
                                class="form-control"
                                min="1"
                                step="0.01"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-dark w-100">

                            Registrar cancha

                        </button>

                    </form>

                </div>
            </div>

        </div>


        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <div class="d-flex justify-content-between align-items-center mb-4">

                        <h4 class="mb-0">
                            Canchas registradas
                        </h4>

                        <span class="badge text-bg-dark"
                              th:text="${canchas.size()}">
                            0
                        </span>

                    </div>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Tipo</th>
                                <th>Precio/hora</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="cancha : ${canchas}">

                                <td th:text="${cancha.id}">
                                    1
                                </td>

                                <td th:text="${cancha.nombre}">
                                    Cancha Central
                                </td>

                                <td th:text="${cancha.tipo}">
                                    FUTBOL
                                </td>

                                <td th:text="${'$ ' + cancha.precioHora}">
                                    $ 50000
                                </td>

                                <td>

                                    <span
                                        th:if="${cancha.activa}"
                                        class="badge text-bg-success">
                                        ACTIVA
                                    </span>

                                    <span
                                        th:unless="${cancha.activa}"
                                        class="badge text-bg-secondary">
                                        INACTIVA
                                    </span>

                                </td>

                                <td>

                                    <form
                                        th:if="${cancha.activa}"
                                        th:action="@{/canchas/{id}/estado(id=${cancha.id})}"
                                        method="post">

                                        <input type="hidden"
                                               name="activa"
                                               value="false">

                                        <button
                                            type="submit"
                                            class="btn btn-sm btn-outline-danger">

                                            Desactivar

                                        </button>

                                    </form>


                                    <form
                                        th:unless="${cancha.activa}"
                                        th:action="@{/canchas/{id}/estado(id=${cancha.id})}"
                                        method="post">

                                        <input type="hidden"
                                               name="activa"
                                               value="true">

                                        <button
                                            type="submit"
                                            class="btn btn-sm btn-outline-success">

                                            Activar

                                        </button>

                                    </form>

                                </td>

                            </tr>


                            <tr th:if="${canchas.isEmpty()}">

                                <td colspan="6"
                                    class="text-center text-muted py-4">

                                    No hay canchas registradas.

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>
            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
